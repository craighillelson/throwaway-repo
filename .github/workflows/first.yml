name: First workflow

on:
  push:
  workflow_dispatch:    # lets you run it manually from the Actions tab

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Look around the runner
        run: |
          echo "Running on:        $RUNNER_OS"
          echo "Triggered by:      $GITHUB_EVENT_NAME"
          echo "Repository:        $GITHUB_REPOSITORY"
          echo "Commit SHA:        $GITHUB_SHA"
          echo "Working directory: $(pwd)"
          ls -la

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: List files now that we've checked out
        run: ls -la
      
  show-data:
    runs-on: ubuntu-latest
    env:
      GREETING: "hello from the workflow"     # workflow-level-ish env var (job scope here)
    steps:
      - name: Read an env var
        env:
          STEP_VAR: "this one is step-scoped"
        run: |
          echo "GREETING is:  $GREETING"
          echo "STEP_VAR is:  $STEP_VAR"

      - name: Read a context value
        run: echo "This run was triggered by ${{ github.actor }}"

      - name: Try to read a missing secret
        run: echo "Secret says: ${{ secrets.MY_FAKE_SECRET }}"
